<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hypertrophy">
<meta name="description" content="Personal hypertrophy log. Not affiliated with RP Strength.">
<title>Hypertrophy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div id="app"><p class="boot" style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#9aa3ad;padding:48px 20px;text-align:center">Loading training history…</p></div>
<script>
(function () {
  function base() {
    var q = location.search.replace(/^\?/, "");
    if (q.indexOf("http") === 0) {
      try { q = decodeURIComponent(q); } catch (e) {}
      if (q.indexOf("http") === 0) return q.replace(/[^/]+$/, "");
    }
    return "./";
  }
  window.__ASSET_BASE__ = base();
  document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"], link[rel="manifest"]').forEach(function (el) {
    var href = el.getAttribute("href");
    if (href && href.indexOf("http") !== 0) el.setAttribute("href", window.__ASSET_BASE__ + href);
  });
  function load(path) {
    return fetch(window.__ASSET_BASE__ + path, { cache: "no-cache" }).then(function (res) {
      if (!res.ok) throw new Error("Could not load " + path + " (" + res.status + ")");
      return res.text();
    });
  }
  function injectScript(code) {
    var s = document.createElement("script");
    s.textContent = code;
    document.body.appendChild(s);
  }
  load("styles.css").then(function (css) {
    var style = document.createElement("style");
    style.textContent = css;
    document.head.appendChild(style);
    return load("logic.js");
  }).then(function (code) {
    injectScript(code);
    return load("overload.js");
  }).then(function (code) {
    injectScript(code);
    return load("app.js");
  }).then(function (code) {
    injectScript(code);
  }).catch(function (err) {
    var el = document.getElementById("app");
    if (el) el.textContent = (err && err.message) ? err.message : "Could not load the log.";
  });
})();
</script>
</body>
</html>
