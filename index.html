<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hypertrophy">
<meta name="description" content="Personal hypertrophy log. Not affiliated with RP Strength.">
<title>Hypertrophy</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div id="app"><p class="boot" style="font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#9aa3ad;padding:48px 20px;text-align:center">Loading training history…</p></div>
<script>
(function () {
  var VERSION = "1";
  function base() {
    var q = location.search.replace(/^\?/, "");
    if (q.indexOf("http") === 0) {
      try { q = decodeURIComponent(q); } catch (e) {}
      if (q.indexOf("http") === 0) return q.replace(/[^/]+$/, "");
    }
    return "./";
  }
  window.__ASSET_BASE__ = base();
  function addStyle() {
    var link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = window.__ASSET_BASE__ + "styles.css?v=" + VERSION;
    document.head.appendChild(link);
  }
  function addScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = window.__ASSET_BASE__ + src + "?v=" + VERSION;
      s.onload = function () { resolve(); };
      s.onerror = function () { reject(new Error("Could not load " + src)); };
      document.body.appendChild(s);
    });
  }
  addStyle();
  addScript("logic.js").then(function () { return addScript("app.js"); }).catch(function (err) {
    var el = document.getElementById("app");
    if (el) el.textContent = (err && err.message) ? err.message : "Could not load the log.";
  });
})();
</script>
</body>
</html>
